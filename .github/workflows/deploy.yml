name: Build and Deploy

# 触发条件：推送到 main 分支自动发布；支持手动触发
# 仅构建并滚动更新 core-job 服务（compose 定义在 web-admin 仓库的
# docker-compose.yml，由 web-admin 的部署流程同步到服务器 /opt/web-admin）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: 构建镜像并推送到 ghcr.io（GITHUB_TOKEN 推送，无需额外 secret）
  # ─────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.IMAGE }}
      sha: ${{ steps.meta.outputs.SHA }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/web-admin-job"
          echo "IMAGE=${IMAGE}" >> $GITHUB_OUTPUT
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE }}:latest
            ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────
  # Job 2: SSH 到服务器滚动更新 core-job（仅该服务，不动 api/rpc/ui）
  # 服务器已持久化 ghcr.io 登录凭据（web-admin 部署时写入），直接 pull
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy core-job
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: NEW_TAG
          script: |
            set -euo pipefail

            DEPLOY_DIR=/opt/web-admin
            HEALTH_RETRIES=12
            HEALTH_INTERVAL=5

            cd "$DEPLOY_DIR"

            # 前置检查：core-job 服务需已定义在 compose 文件中
            # （由 web-admin 仓库的 docker-compose.yml 提供并同步；未包含时仅完成镜像发布）
            if ! sudo docker compose config --services 2>/dev/null | grep -qx "core-job"; then
              echo "⚠️  docker-compose.yml 尚未包含 core-job 服务（等待 web-admin 仓库发布 compose 变更）"
              echo "ℹ️  镜像已发布，跳过部署"
              exit 0
            fi

            # 记录当前 tag 用于回滚
            OLD_TAG=$( (sudo docker inspect sem-web-admin-job \
                         --format '{{.Config.Image}}' 2>/dev/null \
                         || true) \
                       | awk -F: '{print $NF}' )
            echo "current tag: ${OLD_TAG:-<none>}"
            echo "new tag:     $NEW_TAG"

            # 拉镜像并只重建 core-job（服务器已有 ghcr 登录凭据）
            sudo docker pull "ghcr.io/junjie-yan/web-admin-job:$NEW_TAG"
            sudo env JOB_IMAGE_TAG="$NEW_TAG" docker compose up -d --no-deps core-job

            # 健康检查（TCP 探测），失败回滚
            ok=0
            for i in $(seq 1 "$HEALTH_RETRIES"); do
              if sudo docker exec sem-web-admin-job nc -z 127.0.0.1 9105 2>/dev/null; then
                echo "✅ core-job ready (attempt $i)"
                ok=1
                break
              fi
              sleep "$HEALTH_INTERVAL"
            done

            if [ "$ok" != "1" ]; then
              echo "❌ Health check failed"
              sudo docker logs --tail=50 sem-web-admin-job || true
              if [ -n "$OLD_TAG" ] && [ "$OLD_TAG" != "$NEW_TAG" ]; then
                echo "↩️  rolling back to $OLD_TAG"
                sudo env JOB_IMAGE_TAG="$OLD_TAG" docker compose up -d --no-deps core-job
              fi
              exit 1
            fi

            echo "✅ Deployed core-job $NEW_TAG"
