Name: job.rpc
ListenOn: 0.0.0.0:9105

DatabaseConf:
  Type: mysql
  Host: 127.0.0.1
  Port: 3306
  DBName: web_admin
  Username: root
  Password: root123
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5
  Debug: false

# C 端站点管理库（站点、广告、footer、主题、app_detail）
# web-admin-job 通过直连此库执行批量 SQL（导入/批量更新/导出），避免循环依赖 web-admin/rpc/coreclient
SitehubDBConf:
  Type: mysql
  Host: 127.0.0.1
  Port: 3306
  DBName: sitehub
  Username: sitehub_admin
  Password: "sH8RtQ5Zv7Lp2CnMx9Qk"
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5
  Debug: false

RedisConf:
  Host: 127.0.0.1:6379
  Db: 0

Log:
  ServiceName: jobRpcLogger
  Mode: console
  Encoding: plain
  Level: info
  Compress: false
  KeepDays: 7
  StackCoolDownMillis: 100

Prometheus:
  Host: 0.0.0.0
  Port: 4005
  Path: /metrics

AsynqConf:
# if you do not use WithRedisConf, you should uncomment the configuration below

#  Addr: localhost:6379  # Redis address
#  Pass: # Redis Password
#  DB: 0 # Redis database index
#  Concurrency: 20 # max concurrent process job task num
#  SyncInterval: 10 # seconds, this field specifies how often sync should happen
  Enable: true

TaskConf:
  EnableDPTask: true

